<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quan niệm của Hồ Chí Minh về Nhà nước</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400&display=swap">
<style>
:root{--ink:#f6f8f1;--mute:rgba(246,248,241,.72);--line:rgba(246,248,241,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#2a0507;color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.bg{position:fixed;inset:-3%;background:#3a0508 center/cover no-repeat;transition:transform .25s ease-out}
canvas#world,canvas#dove{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
canvas#dove{filter:drop-shadow(0 0 14px rgba(255,236,210,.6))}
.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(30,0,2,.62),rgba(30,0,2,0) 64%),linear-gradient(0deg,rgba(2,24,26,.92),rgba(2,24,26,0) 44%)}
.veil::after{content:'';position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.page{position:relative;min-height:100%;display:flex;flex-direction:column;padding:0 clamp(20px,5vw,64px)}
.logo{padding:22px 0;font-size:13px;letter-spacing:.2em;font-weight:400;text-transform:none;color:var(--mute)}
main{flex:1;display:flex;align-items:center;padding:2vh 0 5vh}
#intro{max-width:620px}
h1{font-weight:300;font-size:clamp(38px,6vw,68px);line-height:1.08;letter-spacing:-.006em;margin:0 0 22px}
h1 em{font-style:italic;display:block;color:#ffd979}
.lede{font-size:16.5px;line-height:1.65;color:var(--mute);max-width:46ch;margin:0 0 30px}
.metal{position:relative;border:0;cursor:pointer;font:400 15px 'Lexend',sans-serif;color:#10200f;padding:15px 30px;border-radius:999px;background:linear-gradient(115deg,#e9efe6 0%,#9fb0a2 22%,#f7fbf4 40%,#7d8f80 58%,#e3ece0 78%,#a9baac 100%);background-size:240% 100%;box-shadow:inset 0 1px 1px #fff,inset 0 -3px 6px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.4);animation:sheen 6s ease-in-out infinite alternate;transition:transform .2s}
.metal:hover{transform:translateY(-2px);animation-duration:2.5s}
button:focus-visible,input:focus-visible{outline:2px solid #ffd979;outline-offset:3px}
@keyframes sheen{to{background-position:100% 0}}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:13px 22px;font:300 14px 'Lexend',sans-serif;cursor:pointer}
.panel{display:none;width:min(100%,580px);border:1px solid var(--line);border-radius:24px;background:rgba(26,4,8,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:22px}
.panel.on{display:block;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.pg{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:12px}
.dots{display:flex;gap:6px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.d{background:#ffd979}
.panel h2{font-weight:400;font-size:clamp(16px,2.2vw,19px);line-height:1.5;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;font:300 15px/1.45 'Lexend',sans-serif;margin:0 0 9px;cursor:pointer;transition:background .2s}
.opt span{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:12px;font-weight:400}
.opt:hover:not(:disabled){background:rgba(255,255,255,.15)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:#7fe3a1;background:rgba(80,200,120,.24)}
.opt.bad{border-color:#ff8f9a;background:rgba(240,90,110,.22)}
.fill{display:flex;flex-wrap:wrap;margin-bottom:6px}
.w{display:flex;gap:5px;margin:0 16px 12px 0}
.box{width:34px;height:44px;text-align:center;font:400 20px 'Lexend',sans-serif;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:10px;text-transform:uppercase;padding:0}
.box.ok{border-color:#7fe3a1;background:rgba(80,200,120,.25)}
.fill.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{min-height:22px;font-size:14px;margin:4px 0 12px}
.fb.ok{color:#9ff0b8}.fb.bad{color:#ffb0b8}
.act{display:flex;gap:12px;flex-wrap:wrap}
#thanks{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(90% 80% at 50% 45%,rgba(70,6,10,.5),rgba(10,2,6,.9));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5}
#thanks.on{display:grid;animation:pop .8s ease}
#thanks h2{font-weight:300;font-size:clamp(30px,6.4vw,66px);line-height:1.2;margin:0 0 20px;max-width:16ch}
#thanks h2 span{display:inline-block;margin:0 .12em;color:transparent;background:linear-gradient(100deg,#fff 20%,#ffb9d3 42%,#ffe9a8 58%,#fff 80%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards,shine 5s linear infinite;animation-delay:calc(var(--i)*.13s),calc(var(--i)*.13s)}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.9);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{to{background-position:-300% 0}}
#thanks p{color:var(--mute);margin:0 0 26px;font-size:16px}
.pt{position:fixed;top:-8vh;width:var(--s);height:calc(var(--s)*1.7);background:linear-gradient(160deg,#fff,#f7a8c8);border-radius:100% 0 100% 0;opacity:.9;pointer-events:none;z-index:6;animation:fall var(--d) linear var(--dl) infinite}
@keyframes fall{to{transform:translate3d(var(--dx),115vh,0) rotate(560deg)}}
@media(max-width:820px){.bg{background-position:74% 12%}main{align-items:flex-end}.box{width:30px;height:40px;font-size:18px}.w{gap:4px;margin-right:12px}}
@media(prefers-reduced-motion:reduce){.pt{display:none}#thanks h2 span{animation:none;opacity:1}.metal{animation:none}}
</style>
</head>
<body>
<div class="bg" id="bg" style="background-image:url('bg.jpg')"></div>
<div class="veil"></div>
<canvas id="world" aria-hidden="true"></canvas>
<canvas id="dove" aria-hidden="true"></canvas>
<div class="page">
  <div class="logo">Tư tưởng Hồ Chí Minh về Nhà nước</div>
  <main>
    <section id="intro">
      <h1><em>Quan niệm của Hồ Chí Minh</em> về Nhà nước</h1>
      <p class="lede">Cùng nhóm chúng em trả lời 5 câu hỏi về bản chất, cơ sở và đặc điểm của Nhà nước mới ở Việt Nam.</p>
      <button class="metal" id="start" type="button">Bắt đầu làm bài</button>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
</div>
<div id="thanks" role="dialog" aria-label="Lời cảm ơn">
  <div>
    <p id="score"></p>
    <h2 id="thx"></h2>
    <button class="metal" id="again" type="button">Làm lại từ đầu</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- QUIZ ---------- */
const Q=[
{q:'Theo quan điểm Hồ Chí Minh, Nhà nước mới mang bản chất gì?',o:['Giai cấp công nhân','Giai cấp nông dân','Giai cấp công nhân và nông dân','Giai cấp công nhân, nông dân và tri thức'],a:0},
{q:'Hồ Chí Minh đã lựa chọn và xác lập mô hình Nhà nước kiểu mới ở Việt Nam dựa trên những cơ sở nào?',o:['Chỉ dựa trên mô hình Nhà nước Xô viết','Truyền thống dân tộc, tiếp thu tư tưởng Đông – Tây và chủ nghĩa Mác – Lênin','Chỉ dựa trên truyền thống văn hóa Việt Nam','Chỉ dựa trên tư tưởng dân chủ phương Tây'],a:1},
{q:'Theo tư tưởng Hồ Chí Minh, nội dung nào thể hiện đúng nhất “Nhà nước do dân”?',o:['Nhân dân là chủ, mọi quyền lực thuộc về nhân dân','Nhà nước phục vụ lợi ích và nguyện vọng chính đáng của nhân dân','Nhân dân lựa chọn, bầu ra đại biểu và tham gia xây dựng, kiểm soát, giám sát Nhà nước','Nhà nước tập trung quyền lực để quản lý xã hội'],a:2},
{q:'Đặc điểm nào sau đây thể hiện đúng nhất “Nhà nước vì dân” theo tư tưởng Hồ Chí Minh?',o:['Nhà nước tập trung quyền lực để điều hành đất nước','Nhà nước phục vụ lợi ích và nguyện vọng chính đáng của nhân dân','Nhân dân trực tiếp quyết định mọi vấn đề của Nhà nước','Nhân dân bầu ra các đại biểu để thay mặt mình'],a:1},
{q:'Điền vào chỗ trống: “Bản chất giai cấp công nhân của Nhà nước ta thể hiện ở nguyên tắc tổ chức và hoạt động cơ bản là…”',fill:['tập','trung','dân','chủ']}
];
const $=id=>document.getElementById(id),L='ABCD',reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
let qi=0,score=0,tries=0,answered=false;
function render(){
  const q=Q[qi];answered=false;tries=0;
  let h=`<div class="pg"><span>Câu ${qi+1}/${Q.length}</span><div class="dots">${Q.map((_,k)=>`<i class="${k<=qi?'d':''}"></i>`).join('')}</div></div><h2>${q.q}</h2>`;
  if(q.fill){
    h+='<div class="fill" id="fill">'+q.fill.map(w=>'<div class="w">'+[...w].map(()=>'<input class="box" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chữ cái">').join('')+'</div>').join('')+'</div>';
    h+='<div class="fb" id="fb">Điền từng chữ cái, mỗi ô một chữ (gõ có dấu hoặc không dấu đều được tính).</div><div class="act" id="act"><button class="metal" id="chk" type="button">Kiểm tra</button></div>';
  }else{
    h+=q.o.map((t,k)=>`<button class="opt" type="button" data-k="${k}"><span>${L[k]}</span>${t}</button>`).join('')+'<div class="fb" id="fb"></div><div class="act" id="act"></div>';
  }
  $('panel').innerHTML=h;
  if(q.fill)setupFill();
  else $('panel').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function nextBtn(){const last=qi===Q.length-1;$('act').innerHTML=`<button class="metal" id="nx" type="button">${last?'Hoàn thành':'Câu tiếp theo'}</button>`;$('nx').onclick=()=>{qi++;qi<Q.length?render():finish()};$('nx').focus();}
function pick(k){
  if(answered)return;answered=true;const q=Q[qi],bs=$('panel').querySelectorAll('.opt');
  bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');});
  if(k===q.a){score++;$('fb').className='fb ok';$('fb').textContent='Chính xác!';}
  else{bs[k].classList.add('bad');$('fb').className='fb bad';$('fb').textContent='Chưa đúng. Đáp án đúng là '+L[q.a]+'.';}
  nextBtn();
}
function setupFill(){
  const bx=[...document.querySelectorAll('.box')];
  bx.forEach((b,i)=>{
    b.addEventListener('focus',()=>b.select());
    b.addEventListener('input',e=>{if(e.isComposing)return;b.value=[...b.value.normalize('NFC')].pop()||'';if(b.value&&bx[i+1])bx[i+1].focus();});
    b.addEventListener('compositionend',()=>{b.value=[...b.value.normalize('NFC')].pop()||'';if(b.value&&bx[i+1])bx[i+1].focus();});
    b.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!b.value&&bx[i-1]){bx[i-1].focus();bx[i-1].value='';}
      else if(e.key==='Enter')check(bx);
      else if(e.key==='ArrowLeft'&&bx[i-1])bx[i-1].focus();
      else if(e.key==='ArrowRight'&&bx[i+1])bx[i+1].focus();
    });
  });
  $('chk').onclick=()=>check(bx);
}
function check(bx){
  if(answered)return;
  const ans=Q[qi].fill.join(''),got=bx.map(b=>b.value).join('');
  if(got.length<bx.length){$('fb').className='fb bad';$('fb').textContent='Bạn chưa điền đủ '+bx.length+' chữ cái.';return;}
  if(norm(got)===norm(ans)){
    answered=true;score++;bx.forEach(b=>{b.classList.add('ok');b.disabled=true});
    $('fb').className='fb ok';$('fb').textContent='Chính xác! Đó là nguyên tắc tập trung dân chủ.';nextBtn();
  }else{
    tries++;const f=$('fill');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
    $('fb').className='fb bad';$('fb').textContent='Chưa đúng, hãy thử lại.';
    if(tries>=2&&!$('rv')){const r=document.createElement('button');r.className='ghost';r.id='rv';r.type='button';r.textContent='Xem đáp án';
      r.onclick=()=>{answered=true;let n=0;Q[qi].fill.forEach(w=>[...w].forEach(c=>{bx[n].value=c;bx[n].disabled=true;bx[n++].classList.add('ok')}));
        $('fb').className='fb bad';$('fb').textContent='Đáp án: tập trung dân chủ.';nextBtn();};$('act').appendChild(r);}
  }
}
function finish(){
  $('panel').classList.remove('on');
  $('score').textContent='Bạn trả lời đúng '+score+'/'+Q.length+' câu';
  $('thx').innerHTML='Cảm ơn thầy và các bạn đã lắng nghe bài thuyết trình của nhóm chúng em'.split(' ').map((w,i)=>`<span style="--i:${i}">${w}</span>`).join(' ');
  $('thanks').classList.add('on');
  if(!reduce&&!document.querySelector('.pt'))for(let i=0;i<34;i++){const p=document.createElement('span');p.className='pt';
    p.style.cssText=`left:${Math.random()*100}vw;--s:${10+Math.random()*14}px;--d:${6+Math.random()*6}s;--dl:${-Math.random()*8}s;--dx:${(Math.random()-.5)*160}px;${Math.random()<.3?'background:linear-gradient(160deg,#fff,#ffe08a)':''}`;document.body.appendChild(p);}
}
$('start').onclick=()=>{$('intro').style.display='none';$('panel').classList.add('on');render();};
$('again').onclick=()=>{$('thanks').classList.remove('on');qi=0;score=0;render();$('panel').classList.add('on');};

/* ---------- LOTUS POND (WebGL, transparent) ---------- */
(function(){
const cv=$('world'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setClearColor(0x000000,0);R.setPixelRatio(Math.min(devicePixelRatio,1.75));
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
const c3=h=>new THREE.Color(h).convertSRGBToLinear();
const rnd=(a,b)=>a+Math.random()*(b-a),cl=x=>Math.min(1,Math.max(0,x));
const cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const tex=c=>{const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;};
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(46,1,.1,80);
{const c=cvs(512,256),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
g.addColorStop(0,'#ffe9c8');g.addColorStop(.45,'#e0553c');g.addColorStop(.52,'#7a1414');g.addColorStop(1,'#0e2a2a');x.fillStyle=g;x.fillRect(0,0,512,256);
const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
const pm=new THREE.PMREMGenerator(R);S.environment=pm.fromEquirectangular(t).texture;pm.dispose();}
S.add(new THREE.HemisphereLight(0xffd9c0,0x10282a,.8));
const sun=new THREE.DirectionalLight(0xffe2b8,2.2);sun.position.set(-3,6,5);S.add(sun);
const d=new THREE.Object3D();

/* camera sizing (needed before placing flowers) */
const mouse={x:0,y:0},cam={x:0,y:0};let halfW=5;
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.fov=w<820?60:46;C.updateProjectionMatrix();halfW=Math.tan(C.fov*Math.PI/360)*7.2*C.aspect;}
size();addEventListener('resize',size);
addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=e.clientY/innerHeight*2-1;});

/* water */
const am=cvs(128,128),ax=am.getContext('2d'),ag=ax.createRadialGradient(64,64,6,64,64,64);ag.addColorStop(0,'#fff');ag.addColorStop(.6,'#bbb');ag.addColorStop(1,'#000');ax.fillStyle=ag;ax.fillRect(0,0,128,128);
const wg=new THREE.PlaneGeometry(46,26,70,40);wg.rotateX(-Math.PI/2);const wp=wg.attributes.position;
const water=new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:c3(0x062f33),roughness:.05,metalness:.35,transparent:true,opacity:.72,alphaMap:new THREE.CanvasTexture(am),envMapIntensity:2,depthWrite:false}));
water.position.set(0,0,-3);S.add(water);

/* lily pads */
const pc=cvs(256,256),px=pc.getContext('2d'),pgr=px.createRadialGradient(128,128,8,128,128,128);
pgr.addColorStop(0,'#9ad67a');pgr.addColorStop(1,'#3f8a47');px.fillStyle=pgr;px.beginPath();px.moveTo(128,128);px.arc(128,128,124,.22,Math.PI*2-.22);px.closePath();px.fill();
px.strokeStyle='rgba(235,255,200,.35)';px.lineWidth=2;for(let i=0;i<22;i++){const a=.3+i*(Math.PI*2-.6)/21;px.beginPath();px.moveTo(128,128);px.lineTo(128+Math.cos(a)*118,128+Math.sin(a)*118);px.stroke();}
const padM=new THREE.MeshStandardMaterial({map:tex(pc),alphaTest:.5,side:THREE.DoubleSide,roughness:.45,envMapIntensity:.9});
const NP2=50,pads=new THREE.InstancedMesh(new THREE.CircleGeometry(.5,28).rotateX(-Math.PI/2),padM,NP2);
for(let i=0;i<NP2;i++){const s=rnd(.8,1.6);d.position.set(rnd(-halfW*1.3,halfW*1.3),.02,rnd(-6,3.5));d.scale.set(s,1,s);d.rotation.set(0,rnd(0,6),0);d.updateMatrix();pads.setMatrixAt(i,d.matrix);pads.setColorAt(i,new THREE.Color().setScalar(rnd(.6,1)));}
S.add(pads);

/* curved petal builder */
function leafGeo(len,wid,curl,cup,c0,c1,c2){
  const nu=8,nv=4,pos=[],cols=[],idx=[];
  for(let i=0;i<=nu;i++){const u=i/nu,w=wid*Math.sin(Math.PI*Math.pow(u,.7))*(1-.15*u);
    for(let j=0;j<=nv;j++){const v=j/nv*2-1;
      pos.push(u*len,-curl*len*u*u+cup*wid*v*v*Math.sin(Math.PI*Math.min(1,u*1.15)),v*w);
      const c=u<.5?c0.clone().lerp(c1,u*2):c1.clone().lerp(c2,(u-.5)*2);c.lerp(c0,Math.abs(v)*.1);cols.push(c.r,c.g,c.b);}}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+1,c=a+nv+1,e=c+1;idx.push(a,c,b,b,c,e);}
  const gm=new THREE.BufferGeometry();gm.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));gm.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));gm.setIndex(idx);gm.computeVertexNormals();return gm;}

/* lotus */
const petalM=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.5,emissive:c3(0x3a1020),envMapIntensity:.9});
const LY=[
 {n:10,tilt:[.75,1.3],off:0,g:leafGeo(.52,.15,.2,.55,c3(0xfff3f6),c3(0xf9c3d6),c3(0xe9769f))},
 {n:8,tilt:[1.05,1.4],off:.3,g:leafGeo(.44,.14,.12,.5,c3(0xfff6f8),c3(0xfbd0df),c3(0xf08fb2))},
 {n:6,tilt:[1.35,1.5],off:0,g:leafGeo(.34,.12,.05,.45,c3(0xfffbe8),c3(0xffe0e8),c3(0xffb8cd))}];
const stemG=new THREE.CylinderGeometry(.011,.017,1,6);stemG.translate(0,.5,0);
const stemM=new THREE.MeshStandardMaterial({color:c3(0x3d7a46),roughness:.8});
const podG=new THREE.CylinderGeometry(.045,.06,.05,12),podM=new THREE.MeshStandardMaterial({color:c3(0xb6c75a),roughness:.7});
const frG=new THREE.CylinderGeometry(.1,.07,.07,24,1,true),frM=new THREE.MeshStandardMaterial({color:c3(0xf3c93f),roughness:.6,side:THREE.DoubleSide,emissive:c3(0x3a2a00)});
const lotus=[],NL=Math.round(cl(halfW*2.2/1.4/1,7,15)*1);
for(let i=0;i<Math.max(7,Math.min(15,Math.round(halfW*2.4)));i++){
  const bud=Math.random()<.25,x=rnd(-halfW*1.05,halfW*1.05),z=rnd(-3.5,2.2),near=1+cl((z+3)/5.5)*.35;
  const gr=new THREE.Group(),h=rnd(.6,1.5),top=h+.3;gr.position.set(x,-.3,z);
  const st=new THREE.Mesh(stemG,stemM);st.scale.y=top;gr.add(st);
  const hd=new THREE.Group();hd.position.y=top;hd.rotation.set(rnd(-.15,.15),rnd(0,6),rnd(-.15,.15));hd.scale.setScalar(rnd(.9,1.2)*near*(bud?.8:1));
  const petals=[];
  LY.forEach(l=>{for(let q=0;q<l.n;q++){const pv=new THREE.Group();pv.rotation.y=q*Math.PI*2/l.n+l.off+rnd(-.05,.05);
    const pe=new THREE.Mesh(l.g,petalM),bt=(bud?l.tilt[1]:l.tilt[0])+rnd(-.06,.06);pe.rotation.z=bt;pe.userData.bt=bt;pv.add(pe);hd.add(pv);petals.push(pe);}});
  const pod=new THREE.Mesh(podG,podM);pod.position.y=.05;const fr=new THREE.Mesh(frG,frM);fr.position.y=.07;hd.add(pod,fr);
  gr.add(hd);gr.userData={s:rnd(0,6),petals};S.add(gr);lotus.push(gr);}

/* ripples */
const rings=[];
for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.RingGeometry(.92,1,56).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xfff0e0,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
  m.userData={ph:i/6*5,x:rnd(-halfW,halfW),z:rnd(-2,2.5)};m.position.y=.03;S.add(m);rings.push(m);}

/* glowing pollen */
const gc=cvs(64,64),gx=gc.getContext('2d'),gg=gx.createRadialGradient(32,32,0,32,32,32);gg.addColorStop(0,'rgba(255,245,200,1)');gg.addColorStop(.3,'rgba(255,225,150,.5)');gg.addColorStop(1,'rgba(255,225,150,0)');gx.fillStyle=gg;gx.fillRect(0,0,64,64);
const NPo=120,pg=new THREE.BufferGeometry(),pp=new Float32Array(NPo*3),pv2=[];
for(let i=0;i<NPo;i++){pp.set([rnd(-halfW,halfW),rnd(.2,4),rnd(-5,3)],i*3);pv2.push([rnd(-.05,.05),rnd(.02,.07),rnd(-.03,.03),rnd(0,6)]);}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
S.add(new THREE.Points(pg,new THREE.PointsMaterial({map:new THREE.CanvasTexture(gc),size:.28,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false})));

const clock=new THREE.Clock();let T=reduce?8:0,fr=0;const bgEl=$('bg');
function frame(){
  const dt=clock.getDelta();if(!reduce)T+=dt;fr++;
  cam.x+=(mouse.x-cam.x)*.04;cam.y+=(mouse.y-cam.y)*.04;
  const mob=innerWidth<820;
  C.position.set(cam.x*.8,1.7-cam.y*.2,7.2);C.lookAt(cam.x*.4,mob?2.0:2.5,0);
  bgEl.style.transform=`translate(${(-cam.x*14).toFixed(1)}px,${(-cam.y*8).toFixed(1)}px)`;
  lotus.forEach(l=>{const u=l.userData;l.rotation.z=Math.sin(T*.7+u.s)*.035;l.rotation.x=Math.cos(T*.5+u.s)*.03;
    const br=Math.sin(T*.8+u.s)*.07;u.petals.forEach(p=>{p.rotation.z=p.userData.bt+br;});});
  rings.forEach(r=>{const k=((T*.35+r.userData.ph)%5)/5;r.scale.setScalar(.2+k*2.6);r.material.opacity=.35*(1-k)*(1-k);r.position.x=r.userData.x;r.position.z=r.userData.z;});
  for(let i=0;i<NPo;i++){const v=pv2[i];pp[i*3]+=v[0]*dt+Math.sin(T+v[3])*.004;pp[i*3+1]+=v[1]*dt;pp[i*3+2]+=v[2]*dt;if(pp[i*3+1]>4.2){pp[i*3+1]=.2;pp[i*3]=rnd(-halfW,halfW);}}
  pg.attributes.position.needsUpdate=true;
  if(!reduce&&fr%2===0){for(let i=0;i<wp.count;i++){const x=wp.getX(i),z=wp.getZ(i);wp.setY(i,Math.sin(x*1.3+T*1.2)*.01+Math.cos(z*1.7+T*.9)*.01+Math.sin((x+z)*2.6+T*1.7)*.005);}wp.needsUpdate=true;wg.computeVertexNormals();}
  R.render(S,C);requestAnimationFrame(frame);
}
frame();
})();

/* ---------- FLYING DOVES (2D canvas, wing-flap warp of the photo) ---------- */
(function(){
const cv=$('dove'),x=cv.getContext('2d'),img=new Image();let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',size);size();
const CU=.368,CV=.627,HEAD=.76,N=44;
const doves=[{sc:1,sp:.04,ph:0,yb:.2,fa:10,al:1,off:0},{sc:.5,sp:.027,ph:2.4,yb:.34,fa:8.5,al:.85,off:.55}];
const pos=(dv,t)=>{const p=(t*dv.sp+dv.off)%1;return[(p*1.5-.25)*W,H*(dv.yb+.07*Math.sin(t*.9+dv.ph)+.035*Math.sin(t*.37+dv.ph*2))];};
let T=reduce?4:0,last=performance.now();
function draw(){
  const now=performance.now();if(!reduce)T+=(now-last)/1000;last=now;
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const base=Math.min(W*.5,Math.max(220,W*.26)),iw=img.naturalWidth,ih=img.naturalHeight,sw=iw/N;
  doves.forEach(dv=>{
    const[px,py]=pos(dv,T),[qx,qy]=pos(dv,T+.05),ang=Math.atan2(qy-py,qx-px)+HEAD,s=base*dv.sc/iw,f=reduce?.2:Math.sin(T*dv.fa+dv.ph);
    x.save();x.globalAlpha=dv.al;x.translate(px,py+f*4);x.rotate(ang);x.scale(s,s);
    const cx=CU*iw,cy=CV*ih;
    for(let i=0;i<N;i++){const sx=i*sw,du=Math.abs((sx+sw/2-cx)/iw),kx=1-.1*(1-f)/2*Math.min(1,du*2.2),yo=-f*ih*.2*Math.pow(du,1.3);
      x.drawImage(img,sx,0,sw+1,ih,(sx-cx)*kx,-cy+yo,sw*kx+1,ih);}
    x.restore();});
  requestAnimationFrame(draw);
}
img.onload=draw;img.src='dove.png';
})();
</script>
