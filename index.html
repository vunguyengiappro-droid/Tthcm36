<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<title>Đố vui: Quan niệm của Hồ Chí Minh về Nhà nước</title>
<style>
:root{--red1:#5a0508;--red2:#b3121b;--red3:#e01e26;--gold1:#fff1b8;--gold2:#f5c542;--gold3:#b8860b;--ink:#fff8e6;--ok:#3ddc84;--bad:#ff6b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red1:#4a0407}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 30% 0%,var(--red3) 0%,var(--red2) 35%,var(--red1) 100%);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",Roboto,sans-serif;overflow-x:hidden;overflow-y:auto;perspective:1400px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.beam{position:fixed;top:-20%;width:26vmax;height:140%;background:linear-gradient(180deg,rgba(255,220,120,.22),transparent 70%);transform-origin:top center;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 50%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 50%,transparent);will-change:transform,opacity;animation:bsway 9s ease-in-out infinite alternate}
.beam.b1{left:5%;transform:rotate(-18deg)}.beam.b2{right:5%;transform:rotate(18deg);animation-delay:-4s}
@keyframes sway{to{opacity:.45;translate:3vw 0}}
.drum{position:fixed;right:-18vmax;bottom:-18vmax;width:50vmax;height:50vmax;border-radius:50%;border:2px solid rgba(255,210,100,.14);box-shadow:inset 0 0 0 16px rgba(255,210,100,.04),inset 0 0 0 34px rgba(255,210,100,.05);pointer-events:none;animation:spin 90s linear infinite}
@keyframes spin{to{rotate:360deg}}
.wrap{position:relative;z-index:2;min-height:100%;max-width:880px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(60,0,4,.85),rgba(150,10,18,.5));border:1px solid rgba(245,197,66,.5);box-shadow:0 0 24px rgba(245,197,66,.25)}
.bar h2{font-family:"Playfair Display","Times New Roman",Times,serif;font-size:clamp(15px,3.6vw,22px);letter-spacing:.04em;background:linear-gradient(180deg,var(--gold1),var(--gold2) 60%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.score{font-weight:700;color:var(--gold1);white-space:nowrap}
.star{width:64px;height:64px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(135deg,var(--gold1),var(--gold2) 45%,var(--gold3) 70%,var(--gold1));animation:flip 6s linear infinite;filter:drop-shadow(0 0 10px var(--gold2));flex:none}
.star.big{width:150px;height:150px;margin:0 auto}
.star.sm{width:34px;height:34px}
@keyframes flip{to{transform:rotateY(360deg)}}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 0;transform-style:preserve-3d}
.card{width:100%;padding:clamp(18px,4vw,34px);border-radius:24px;background:linear-gradient(160deg,rgba(120,8,14,.78),rgba(50,0,4,.88));border:2px solid var(--gold2);position:relative;transform-style:preserve-3d;transition:transform .15s ease-out;box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 60px rgba(245,197,66,.25)}
.pop{animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:rotateX(-25deg) translateZ(-120px) scale(.9)}}
.qn{font-size:14px;color:var(--gold2);margin-bottom:8px;transform:translateZ(30px)}
.q{font-family:"Playfair Display","Times New Roman",Times,serif;font-size:clamp(20px,4.6vw,30px);line-height:1.35;margin-bottom:20px;color:var(--gold1);text-shadow:0 2px 12px rgba(0,0,0,.6);transform:translateZ(40px)}
.opts{display:grid;gap:12px;transform-style:preserve-3d}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;line-height:1.4;font-size:clamp(15px,3.6vw,18px);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(245,197,66,.45);transition:transform .2s,box-shadow .2s,background .2s;transform:translateZ(20px)}
.opt:hover,.opt:focus-visible{transform:translateZ(46px) scale(1.02);box-shadow:0 12px 26px rgba(0,0,0,.45),0 0 24px rgba(245,197,66,.5);background:linear-gradient(135deg,rgba(245,197,66,.28),rgba(255,255,255,.05))}
.opt:focus-visible{outline:2px solid var(--gold1);outline-offset:2px}
.opt b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#4a0407;background:linear-gradient(135deg,var(--gold1),var(--gold2) 60%,var(--gold3));box-shadow:0 0 12px rgba(245,197,66,.6)}
.opt.ok{background:linear-gradient(135deg,rgba(61,220,132,.45),rgba(20,90,50,.5));border-color:var(--ok);box-shadow:0 0 30px rgba(61,220,132,.6);animation:glow 1s ease 2}
.opt.no{background:linear-gradient(135deg,rgba(255,107,107,.4),rgba(90,10,10,.5));border-color:var(--bad);animation:shake .4s}
.opts.done .opt{pointer-events:none}
@keyframes shake{25%{translate:-8px 0}75%{translate:8px 0}}
@keyframes glow{50%{box-shadow:0 0 50px rgba(61,220,132,.95)}}
.fill{display:flex;gap:10px;flex-wrap:wrap;transform:translateZ(20px)}
.fill{justify-content:center}
.words{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:center;transform:translateZ(20px);margin-bottom:22px}
.word{display:flex;gap:6px}
.lt{width:clamp(28px,8vw,46px);height:clamp(40px,11vw,58px);padding:0;text-align:center;text-transform:uppercase;font:700 clamp(18px,5vw,26px) "Playfair Display","Times New Roman",Times,serif;color:var(--gold1);caret-color:var(--gold1);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(0,0,0,.4));border:2px solid var(--gold2);border-radius:10px;box-shadow:0 5px 0 #7a5606,0 0 14px rgba(245,197,66,.35);transition:transform .15s,box-shadow .15s}
.lt:focus{outline:none;transform:translateY(-4px);border-color:#fff;box-shadow:0 9px 0 #7a5606,0 0 28px rgba(245,197,66,.95)}
.lt.ok{background:linear-gradient(135deg,rgba(61,220,132,.55),rgba(20,90,50,.65));border-color:var(--ok);box-shadow:0 5px 0 #0d5a30,0 0 20px rgba(61,220,132,.8);animation:flipk .6s both}
.lt.no{background:linear-gradient(135deg,rgba(255,107,107,.5),rgba(90,10,10,.6));border-color:var(--bad);box-shadow:0 5px 0 #6a1010;animation:shake .4s}
@keyframes flipk{from{transform:rotateX(90deg)}}
.hint{text-align:center;font-size:14px;opacity:.85;margin-bottom:16px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 28px;border-radius:999px;font-weight:700;color:#4a0407;background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));box-shadow:0 6px 0 #7a5606,0 12px 26px rgba(0,0,0,.5),0 0 26px rgba(245,197,66,.6);transition:transform .12s,box-shadow .12s;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #7a5606,0 4px 10px rgba(0,0,0,.5)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.note{margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.35);border-left:4px solid var(--gold2);line-height:1.55;display:none}
.note.show{display:block;animation:pop .4s}
.next{margin-top:16px;display:none;text-align:right}.next.show{display:block}
.center{text-align:center}
.title{font-family:"Playfair Display","Times New Roman",Times,serif;font-size:clamp(26px,7vw,46px);line-height:1.2;margin:18px 0 10px;background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.sub{opacity:.9;margin-bottom:26px;line-height:1.6}
.big{font-size:64px;font-weight:800;color:var(--gold1);text-shadow:0 0 30px var(--gold2)}
.prog{height:8px;border-radius:8px;background:rgba(0,0,0,.4);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold3),var(--gold1));box-shadow:0 0 12px var(--gold2);transition:width .5s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.qn,.q,.fill,.words,.opt{transform:none}

.card{background:linear-gradient(160deg,rgba(74,4,10,.93),rgba(28,0,3,.95));border:1px solid rgba(245,197,66,.7);box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,230,150,.12) inset,0 0 50px rgba(245,197,66,.18)}
.opt{background:rgba(25,0,3,.45);border:1px solid rgba(245,197,66,.4);box-shadow:none;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.opt:hover,.opt:focus-visible{transform:translateY(-2px);border-color:var(--gold1);background:rgba(245,197,66,.13);box-shadow:0 8px 22px rgba(0,0,0,.4),0 0 20px rgba(245,197,66,.3)}
.opt b{background:transparent;border:1.5px solid var(--gold2);color:var(--gold1);box-shadow:none;font-family:"Playfair Display","Times New Roman",Times,serif}
.opt.ok{background:rgba(30,140,80,.35);border-color:var(--ok);box-shadow:0 0 26px rgba(61,220,132,.45)}
.opt.no{background:rgba(160,30,30,.35);border-color:var(--bad)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#06331a}
.btn{color:#4a0407;background:linear-gradient(180deg,#ffeeb0,#e6b12c 55%,#b8860b);box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.75),0 0 22px rgba(245,197,66,.4)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.75),0 0 30px rgba(245,197,66,.6)}
.btn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.lt{background:rgba(25,0,3,.5);border:1px solid var(--gold2);box-shadow:inset 0 0 12px rgba(245,197,66,.15),0 0 12px rgba(245,197,66,.2)}
.lt:focus{transform:none;border-color:#fff;box-shadow:inset 0 0 14px rgba(245,197,66,.3),0 0 22px rgba(245,197,66,.8)}
.lt.ok{background:rgba(30,140,80,.45);border-color:var(--ok);box-shadow:0 0 16px rgba(61,220,132,.6)}
.lt.no{background:rgba(160,30,30,.45);border-color:var(--bad);box-shadow:0 0 12px rgba(255,107,107,.5)}
.note{background:rgba(0,0,0,.32);border-left:3px solid var(--gold2)}
.next{position:relative;z-index:5}

#sk{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sh{animation:shine 4.2s ease-in-out infinite}@keyframes shine{0%,30%{transform:translateX(0)}100%{transform:translateX(330px)}}
.sp{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
@media (min-width:900px) and (min-aspect-ratio:1/1){.wrap{margin-left:5vw;margin-right:auto;max-width:min(680px,50vw)}.bg{background-position:center}}

@keyframes bsway{to{opacity:.45;translate:3vw 0}}
.sh,.sp{display:none}
#hs{animation:none}#hs::before,#hs::after{display:none}
.dv,.pd{filter:none}.dv{will-change:transform}
.skc{position:fixed;left:0;width:200vw;pointer-events:none;z-index:0;will-change:transform;animation:skm 34s linear infinite}
#sk1{bottom:0;height:38vh}#sk2{top:0;height:26vh;animation-duration:46s;animation-direction:reverse;opacity:.85}
@keyframes skm{to{transform:translate3d(-50%,0,0)}}

.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.alt{color:var(--gold1);background:rgba(0,0,0,.3);border:1px solid var(--gold2);box-shadow:0 0 16px rgba(245,197,66,.25)}
.btn.alt:hover{background:rgba(245,197,66,.18)}
.card.ty{overflow:hidden}
.tyw>*:not(.rays):not(.fs){position:relative;z-index:1}
.rays{position:absolute;left:50%;top:36%;width:190%;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(rgba(255,205,90,.22) 0 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%);mask-image:radial-gradient(circle,#000 0,transparent 60%);animation:spin 40s linear infinite;pointer-events:none}
.fs{position:absolute;top:-30px;background:linear-gradient(135deg,#fff1b8,#f5c542,#b8860b);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(900px) rotate(540deg)}}
.tyt{font-family:"Playfair Display","Times New Roman",Times,serif;font-size:clamp(28px,7.5vw,52px);line-height:1.25;margin:14px 0 10px;color:var(--gold1);letter-spacing:.04em;text-shadow:0 0 22px rgba(255,190,60,.9),0 3px 10px rgba(0,0,0,.6)}
.tyt span{display:inline-block;animation:ltr .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes ltr{from{opacity:0;transform:translateY(40px) scale(.3) rotate(-12deg)}}
.tys{font-size:clamp(16px,3.8vw,21px);line-height:1.6;margin-top:8px;animation:fup 1s 1.8s both}
.tys.s2{animation-delay:2.3s;color:var(--gold1)}.tys.s3{animation-delay:2.8s;margin-top:20px}
@keyframes fup{from{opacity:0;transform:translateY(16px)}}
.tyw .gs.big{width:min(230px,58vw)}.tyw .tyt{margin-top:0}
</style>
</head>
<body>
<div class="bg"></div><canvas id="sk1" class="skc"></canvas><canvas id="sk2" class="skc"></canvas>
<div class="beam b1"></div><div class="beam b2"></div><div class="drum" style="will-change:transform"></div>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="bar"><div class="gs" id="hs" style="width:54px;flex:none"></div><h2>TƯ TƯỞNG HỒ CHÍ MINH VỀ NHÀ NƯỚC</h2><div class="score" id="score">⭐ 0</div></div>
  <div class="pgw"><div class="prog"><i id="pg"></i></div><div class="pd" id="pd"></div></div>
  <div class="stage"><div class="card pop" id="card"></div></div>
</div>
<script>
const Q=[
{q:"Theo quan điểm Hồ Chí Minh, Nhà nước mới mang bản chất gì?",o:["Giai cấp công nhân","Giai cấp nông dân","Giai cấp công nhân và nông dân","Giai cấp công nhân, nông dân và tri thức"],a:0,n:"Nhà nước mới mang bản chất giai cấp công nhân, đồng thời là nhà nước của dân, do dân, vì dân."},
{q:"Hồ Chí Minh đã lựa chọn và xác lập mô hình Nhà nước kiểu mới ở Việt Nam dựa trên những cơ sở nào?",o:["Chỉ dựa trên mô hình Nhà nước Xô viết","Truyền thống dân tộc, tiếp thu tư tưởng Đông – Tây và chủ nghĩa Mác – Lênin","Chỉ dựa trên truyền thống văn hóa Việt Nam","Chỉ dựa trên tư tưởng dân chủ phương Tây"],a:1,n:"Mô hình được xây dựng trên sự kết hợp truyền thống dân tộc, tinh hoa Đông – Tây và chủ nghĩa Mác – Lênin."},
{q:"Theo tư tưởng Hồ Chí Minh, nội dung nào thể hiện đúng nhất “Nhà nước do dân”?",o:["Nhân dân là chủ, mọi quyền lực thuộc về nhân dân","Nhà nước phục vụ lợi ích và nguyện vọng chính đáng của nhân dân","Nhân dân lựa chọn, bầu ra đại biểu và tham gia xây dựng, kiểm soát, giám sát Nhà nước","Nhà nước tập trung quyền lực để quản lý xã hội"],a:2,n:"“Do dân” là nhân dân bầu ra đại biểu, tham gia xây dựng, kiểm soát và giám sát Nhà nước."},
{q:"Đặc điểm nào sau đây thể hiện đúng nhất “Nhà nước vì dân” theo tư tưởng Hồ Chí Minh?",o:["Nhà nước tập trung quyền lực để điều hành đất nước","Nhà nước phục vụ lợi ích và nguyện vọng chính đáng của nhân dân","Nhân dân trực tiếp quyết định mọi vấn đề của Nhà nước","Nhân dân bầu ra các đại biểu để thay mặt mình"],a:1,n:"“Vì dân” nghĩa là mọi hoạt động của Nhà nước nhằm phục vụ lợi ích và nguyện vọng chính đáng của nhân dân."},
{q:"Điền vào chỗ trống: “Bản chất giai cấp công nhân của Nhà nước ta thể hiện ở nguyên tắc tổ chức và hoạt động cơ bản là …”",fill:true,a:"tập trung dân chủ",n:"Đáp án: nguyên tắc tập trung dân chủ."}
];
const $=id=>document.getElementById(id),card=$("card");
const W=["tập","trung","dân","chủ"],L=[...W.join("")];
let i=0,score=0,fw=0,fw2=0;
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();

function show(html,c){clearInterval(fw);clearInterval(fw2);card.classList.remove("pop");void card.offsetWidth;card.innerHTML=html;card.classList.add("pop");card.classList.toggle("ty",!!c)}
function intro(){i=0;score=0;$("score").textContent="⭐ 0";setP(0);
show(`<div class="center"><div class="gs big">${starSVG()}</div><h1 class="title">Đố vui: Nhà nước của dân, do dân, vì dân</h1><p class="sub">5 câu hỏi về quan niệm của Chủ tịch Hồ Chí Minh về Nhà nước mới.<br>Trả lời đúng để thắp sáng ngôi sao vàng!</p><button class="btn" id="go">Bắt đầu chơi</button></div>`);
$("go").onclick=ask}
function ask(){
const d=Q[i];setP(i/Q.length);fly(i);
let body;
if(d.fill){body=`<div class="words">${W.map(w=>`<div class="word">${[...w].map(()=>`<input class="lt" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Chữ cái">`).join("")}</div>`).join("")}</div><p class="hint">Điền từng chữ cái, không cần gõ dấu (${L.length} ô)</p><div class="fill"><button class="btn" id="ok">Kiểm tra</button></div>`}
else{body=`<div class="opts" id="opts">${d.o.map((t,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${t}</span></button>`).join("")}</div>`}
show(`<div class="qn">Câu ${i+1} / ${Q.length}</div><div class="q">${d.q}</div>${body}<div class="note" id="note"></div><div class="next" id="next"><button class="btn" id="nx">${i<Q.length-1?"Câu tiếp theo":"Xem kết quả"}</button></div>`);
$("nx").onclick=()=>{i++;i<Q.length?ask():end()};
if(d.fill){const bx=[...document.querySelectorAll(".lt")];
const chk=()=>{if(bx.some(b=>!b.value))return bx.find(b=>!b.value).focus();let all=true;
bx.forEach((b,k)=>{const good=norm(b.value)===norm(L[k]);if(!good)all=false;b.value=L[k];b.disabled=true;b.style.animationDelay=(k*60)+"ms";b.classList.add(good?"ok":"no")});
$("ok").style.display="none";const r=bx[0].getBoundingClientRect();finish(all,bx[bx.length>>1])};
bx.forEach((b,k)=>{
b.addEventListener("input",e=>{if(e.isComposing)return;const v=[...b.value].pop()||"";b.value=v;if(v&&k<bx.length-1)bx[k+1].focus()});
b.addEventListener("compositionend",()=>{const v=[...b.value].pop()||"";b.value=v});
b.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!b.value&&k>0){bx[k-1].value="";bx[k-1].focus()}
else if(e.key==="ArrowLeft"&&k>0)bx[k-1].focus();else if(e.key==="ArrowRight"&&k<bx.length-1)bx[k+1].focus();
else if(e.key==="Enter")chk()})});
$("ok").onclick=chk;bx[0].focus()}
else document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;$("opts").classList.add("done");const ok=k===d.a;b.classList.add(ok?"ok":"no");if(!ok)document.querySelector(`.opt[data-k="${d.a}"]`).classList.add("ok");finish(ok,b)});
}
function finish(ok,el){
const d=Q[i];if(ok){score++;$("score").textContent="⭐ "+score;const r=(el||$("card")).getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);launch(r.left+r.width/2,r.top)}
const n=$("note");n.innerHTML=(ok?"✅ <b>Chính xác!</b> ":"❌ <b>Chưa đúng.</b> ")+d.n;n.classList.add("show");$("next").classList.add("show");$("nx").focus({preventScroll:true});$("next").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function end(){
setP(1);for(let k=0;k<5;k++)fly(k,k*400);
const t=score===5?"Xuất sắc! Bạn nắm vững tư tưởng Hồ Chí Minh":score>=3?"Khá tốt! Cố thêm chút nữa nhé":"Hãy ôn lại và thử lần nữa";
show(`<div class="center"><div class="gs big">${starSVG()}</div><div class="big">${score}/${Q.length}</div><h1 class="title">${t}</h1><p class="sub">Nhà nước ta là Nhà nước của dân, do dân, vì dân.</p><div class="row"><button class="btn" id="ty">Lời cảm ơn</button><button class="btn alt" id="re">Chơi lại</button></div></div>`);
$("re").onclick=intro;$("ty").onclick=thanks;if(score>=3)for(let k=0;k<5;k++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.4)),k*300);
}
// nghiêng 3D theo con trỏ
let pm=null,ptk=0;addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"||(e.target.closest&&e.target.closest("button,input")))return;pm=e;if(!ptk)ptk=requestAnimationFrame(()=>{ptk=0;const r=card.getBoundingClientRect(),x=(pm.clientX-r.left)/r.width,y=(pm.clientY-r.top)/r.height;card.style.transform=(x<-.3||x>1.3||y<-.3||y>1.3)?"":`perspective(1200px) rotateY(${(x-.5)*6}deg) rotateX(${(.5-y)*4}deg)`})});
// hạt sáng + pháo hoa vàng
const cv=$("fx"),cx=cv.getContext("2d"),DPR=Math.min(devicePixelRatio||1,1.5);let P=[];
function rs(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
rs();addEventListener("resize",rs);
const SP=document.createElement("canvas");SP.width=SP.height=32;{const g=SP.getContext("2d"),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,"rgba(255,235,160,1)");r.addColorStop(.35,"rgba(255,200,80,.6)");r.addColorStop(1,"rgba(255,180,50,0)");g.fillStyle=r;g.fillRect(0,0,32,32)}
for(let k=0;k<26;k++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.3,vy:-.2-Math.random()*.6,r:3+Math.random()*4,l:1,amb:1});
function burst(x,y,n=40){for(let k=0;k<n;k++){const a=Math.random()*6.283,s=2+Math.random()*6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5+Math.random()*6,l:1,g:.12})}}
let lt=0;(function loop(t){requestAnimationFrame(loop);if(t-lt<32)return;lt=t;cx.clearRect(0,0,innerWidth,innerHeight);cx.globalCompositeOperation="lighter";
P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;if(p.g){p.vy+=p.g;p.l-=.03}if(p.amb&&p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth}
if(p.l<=0)return false;cx.globalAlpha=p.amb?.6:p.l;cx.drawImage(SP,p.x-p.r,p.y-p.r,p.r*2,p.r*2);return true});cx.globalAlpha=1})(0);

function mx(S,t){t=Math.max(0,Math.min(.999,t))*(S.length-1);const i=Math.floor(t),u=t-i,a=S[i],b=S[i+1];return "rgb("+a.map((v,j)=>Math.round(v+(b[j]-v)*u)).join()+")"}
const GOLD=[[60,32,0],[150,92,8],[228,165,34],[255,231,140],[255,251,222]],SILK=[[58,3,7],[190,20,28],[240,52,44],[255,140,112]];
function ribbon(){let bk="",fr="";const N=56,rot=-20*Math.PI/180,c=(j)=>{const t=j/N,th=(155+385*t)*Math.PI/180,g=t>.82?(t-.82)*2.6:0,x=(112+70*g)*Math.cos(th),y=58*Math.sin(th)-g*70*(1+g);return {x:100+x*Math.cos(rot)-y*Math.sin(rot),y:100+x*Math.sin(rot)+y*Math.cos(rot),t,th}};
for(let i=0;i<N;i++){const a=c(i),b=c(i+1),d=c(Math.min(N,i+2)),tw=Math.cos(a.t*Math.PI*3.4),w=(2+24*Math.pow(Math.sin(Math.PI*Math.min(1,a.t*1.02)),.7))*(.4+.6*Math.abs(tw)),
dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l*w/2,ny=dx/l*w/2,dx2=d.x-b.x,dy2=d.y-b.y,l2=Math.hypot(dx2,dy2)||1,w2=w,n2x=-dy2/l2*w2/2,n2y=dx2/l2*w2/2,
col=mx(SILK,.5+.5*tw*(tw>0?1:.6)-.1),q=`<path d="M${a.x+nx},${a.y+ny}L${b.x+n2x},${b.y+n2y}L${b.x-n2x},${b.y-n2y}L${a.x-nx},${a.y-ny}Z" fill="${col}" stroke="${col}" stroke-width=".7"/>`+(tw>.55?`<path d="M${a.x},${a.y}L${b.x},${b.y}" stroke="rgba(255,215,190,${(tw-.55)*.9})" stroke-width="1.4" fill="none"/>`:"");
if(Math.sin((a.th+b.th)/2)>0)fr+=q;else bk+=q}return [bk,fr]}
function starSVG(){const R=92,r=40,C=100,P=(a,d)=>[C+d*Math.cos(a*Math.PI/180),C+d*Math.sin(a*Math.PI/180)],O=[],I=[];
for(let k=0;k<5;k++){O.push(P(-90+72*k,R));I.push(P(-54+72*k,r))}
const ring=(dx,dy)=>O.map((o,k)=>[o,I[k]]).flat().map(q=>(q[0]+dx).toFixed(1)+","+(q[1]+dy).toFixed(1)).join(" ");
let defs="",fc="";
for(let k=0;k<5;k++)[[I[(k+4)%5],-18,.16],[I[k],18,-.16]].forEach(([q,off,adj],j)=>{const id="fg"+k+j,ao=-90+72*k+off,t=.5+.5*Math.cos((ao+135)*Math.PI/180)+adj,o=O[k];
defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="${o[0].toFixed(1)}" y2="${o[1].toFixed(1)}"><stop offset="0" stop-color="${mx(GOLD,t-.25)}"/><stop offset=".55" stop-color="${mx(GOLD,t)}"/><stop offset="1" stop-color="${mx(GOLD,t+.22)}"/></linearGradient>`;
fc+=`<path d="M100,100L${o[0].toFixed(1)},${o[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}Z" fill="url(#${id})" stroke="rgba(255,244,200,.75)" stroke-width=".6" stroke-linejoin="round"/>`});
const [bk,fr]=ribbon();
return `<svg viewBox="-70 -40 340 270"><defs>${defs}<clipPath id="scp"><polygon points="${ring(0,0)}"/></clipPath><linearGradient id="shg"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${bk}<polygon points="${ring(8,10)}" fill="#3d2300"/><polygon points="${ring(4,5)}" fill="#7a4a04"/>${fc}<g clip-path="url(#scp)"><g transform="rotate(22 100 100)"><rect class="sh" x="-90" y="-30" width="30" height="260" fill="url(#shg)"/></g></g>${fr}<path class="sp" d="M0,-16L2.4,-2.4 16,0 2.4,2.4 0,16-2.4,2.4-16,0-2.4,-2.4Z" fill="#fff" transform="translate(82,52)"/></svg>`}
function doveSVG(){return '<svg viewBox="0 -6 120 80"><g class="wf wb"><path fill="#d7dfee" d="M62,42C48,12 70,0 92,4C80,14 76,28 72,44Z"/></g><path fill="#f1f4fa" d="M24,50L4,40L8,52L22,54Z"/><path fill="#fff" d="M18,50C30,38 56,36 80,42C90,36 100,36 108,42C104,58 72,64 50,60C36,58 26,56 18,50Z"/><path fill="#f5a623" d="M107,42L118,44L107,46Z"/><circle cx="100" cy="41" r="1.6" fill="#333"/><g class="wf"><path fill="#fff" stroke="#cfd8e8" stroke-width="1" d="M62,44C44,10 74,-2 100,6C84,16 80,32 74,48Z"/></g></svg>'}
const FL=[[[-18,70],[50,18],[118,34]],[[118,22],[50,62],[-18,14]],[[-18,14],[40,58],[118,76]],[[118,80],[62,28],[-18,42]],[[-18,52],[50,8],[118,12]]];
function fly(n,dl=0){const [a,b,c]=FL[n%5],d=document.createElement("div"),f=c[0]<a[0]?-1:1,t=q=>`translate(${q[0]}vw,${q[1]}vh) scaleX(${f})`;d.className="dv";d.innerHTML=doveSVG();document.body.appendChild(d);
d.animate([{transform:t(a)},{transform:t(b)},{transform:t(c)}],{duration:5600,easing:"ease-in-out",delay:dl,fill:"backwards"}).onfinish=()=>d.remove()}
function launch(x,y){for(let k=0;k<3;k++){const d=document.createElement("div");d.className="dv";d.style.width="64px";d.innerHTML=doveSVG();document.body.appendChild(d);const dx=(k-1)*170,f=dx<0?-1:1;
d.animate([{transform:`translate(${x-32}px,${y}px) scaleX(${f})`,opacity:1},{transform:`translate(${x-32+dx}px,${y-280-k*40}px) scaleX(${f})`,opacity:0}],{duration:1900,easing:"ease-out"}).onfinish=()=>d.remove()}}
function setP(p){$("pg").style.width=p*100+"%";$("pd").style.left=`calc(${p*100}% - ${p*48}px)`}
$("hs").innerHTML=starSVG();$("pd").innerHTML=doveSVG();
addEventListener("keydown",e=>{const n=$("nx");if(n&&$("next").classList.contains("show")&&(e.key==="ArrowRight"||(e.key===" "&&e.target.tagName!=="BUTTON"))){e.preventDefault();n.click()}});
function silk(id,H,bands){const c=$(id),W=960,g=c.getContext("2d");c.width=W*2;c.height=H;
bands.forEach(([y0,amp,ph,th,a,k1,k2])=>{for(let x=0;x<=W*2;x+=2){const q=x*Math.PI*2/W,t0=y0+amp*Math.sin(q*k1+ph)+amp*.5*Math.sin(q*k2-ph*1.4),t1=y0+th*(.7+.3*Math.sin(q*k1*1.5+ph*.7))+amp*Math.sin(q*k1+ph+.8)+amp*.5*Math.sin(q*k2-ph*1.4+.6),gr=g.createLinearGradient(0,t0,0,t1);
gr.addColorStop(0,"rgba(90,4,9,0)");gr.addColorStop(.3,`rgba(205,26,34,${a})`);gr.addColorStop(.52,`rgba(255,125,98,${a})`);gr.addColorStop(.66,`rgba(185,18,26,${a})`);gr.addColorStop(1,"rgba(70,3,8,0)");g.fillStyle=gr;g.fillRect(x,t0,2,t1-t0)}})}
silk("sk1",260,[0,1,2,3,4].map(k=>[26+k*34,12+k*3,k*1.7,60,.5-.06*k,2+(k%3)*2,3+(k%2)*2]));
silk("sk2",200,[0,1,2].map(k=>[-8+k*22,9+k*2,k*2.3,58,.5-.09*k,2+k*2,3+k*2]));

function tl(s,d){return [...s].map((c,k)=>c===" "?" ":`<span style="animation-delay:${d+k*70}ms">${c}</span>`).join("")}
function thanks(){setP(1);
const fs=Array.from({length:16},()=>`<i class="fs" style="left:${Math.random()*96}%;width:${10+Math.random()*12}px;height:${10+Math.random()*12}px;animation-duration:${5+Math.random()*5}s;animation-delay:-${Math.random()*9}s"></i>`).join("");
show(`<div class="center tyw"><div class="rays"></div>${fs}<div class="gs big">${starSVG()}</div><h1 class="tyt">${tl("CẢM ƠN THẦY",200)}<br>${tl("VÀ CÁC BẠN",1000)}</h1><p class="tys">đã lắng nghe bài thuyết trình của nhóm em</p><p class="tys s2">Kính chúc thầy cô và các bạn thật nhiều sức khỏe và thành công!</p><div class="row tys s3"><button class="btn alt" id="rp">Chơi lại</button></div></div>`,1);
$("rp").onclick=intro;
const w=()=>burst(innerWidth*(.1+Math.random()*.8),innerHeight*(.12+Math.random()*.5),60),fl=()=>{for(let k=0;k<5;k++)fly(k,k*350)};
w();w();fl();fw=setInterval(w,650);fw2=setInterval(fl,7500)}

intro();
</script>
